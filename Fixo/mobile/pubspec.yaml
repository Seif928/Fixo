name: fixo_mobile
description: "FIXO — Egyptian Home Services Marketplace (Customer & Technician App)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.8.0+1
  intl: any
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  firebase_messaging: ^17.0.1
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^11.2.0
  google_sign_in: ^7.2.0
  url_launcher: ^6.3.2
  maplibre_gl: ^0.27.1
  image_picker: ^1.2.3
  geolocator: ^14.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: ^6.0.0

  url_launcher_platform_interface: ^2.3.2
flutter:
  uses-material-design: true
  assets:
    - assets/locations/egypt.json
    - assets/locations/LICENSE.txt
    - assets/fonts/cairo/OFL.txt
    - assets/fonts/manrope/OFL.txt
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/cairo/Cairo.ttf
    - family: Manrope
      fonts:
        - asset: assets/fonts/manrope/Manrope.ttf
