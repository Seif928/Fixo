version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: fixo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fixo_user
      POSTGRES_PASSWORD: fixo_dev_password
      POSTGRES_DB: fixo_dev
    ports:
      - "5432:5432"
    volumes:
      - fixo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fixo_user -d fixo_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  fixo_postgres_data:
