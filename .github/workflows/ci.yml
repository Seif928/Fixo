name: FIXO Full-Stack CI (Free QA)

on:
  push:
    branches: [main, fixo-connected-communications]
  pull_request:
    branches: [main, fixo-connected-communications]

jobs:
  backend:
    name: Backend Lint, Tests & Prisma Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Fixo/backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fixo_ci_password
          POSTGRES_DB: fixo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:fixo_ci_password@localhost:5432/fixo_test
      DIRECT_URL: postgresql://postgres:fixo_ci_password@localhost:5432/fixo_test
      TEST_DATABASE_URL: postgresql://postgres:fixo_ci_password@localhost:5432/fixo_test
      JWT_SECRET: ci-only-secret-key-min-32-chars-long-fixo
      OTP_HMAC_SECRET: ci-only-otp-hmac-secret-min-32-chars-fixo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: Fixo/backend/package-lock.json
      - run: npm ci
      - run: npm run prisma:validate
      - run: npm run prisma:generate
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high

  web:
    name: Web Lint, Security Tests & Next Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Fixo/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: Fixo/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: example-anon-key
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: example-publishable-key
        run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  mobile:
    name: Flutter Analyze & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Fixo/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
